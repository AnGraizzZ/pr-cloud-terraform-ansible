---
- name: Install Kibana on Grafana Host
  hosts: services_out
  become: true
  tasks:
    - name: Create Kibana config directory
      file:
        path: /opt/kibana
        state: directory
        mode: '0755'

    - name: Deploy Kibana configuration
      template:
        src: ../templates/kibana.yml.j2
        dest: /opt/kibana/kibana.yml
        owner: root
        group: root
        mode: '0644'

    - name: Wait for Docker socket to be ready
      wait_for:
        path: /var/run/docker.sock
        timeout: 60

    - name: Run Kibana container
      community.docker.docker_container:
        name: kibana
        image: docker.elastic.co/kibana/kibana:8.15.0
        state: started
        restart_policy: always
        network_mode: host
        env:
          SERVER_HOST: "0.0.0.0"
          ELASTICSEARCH_HOSTS: "http://{{ groups['services_in'][0] }}:9200"
          XPACK_SECURITY_ENABLED: "false"
          XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "something_at_least_32_characters_long_for_kibana"